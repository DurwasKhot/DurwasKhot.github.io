<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>

/* ================================================================
   EDIT ME — everything you need to personalise is right here.
   ================================================================ */
:root{
  --name: "Alex";                 /* also set in JS CONFIG below */
}

*{ box-sizing:border-box; margin:0; padding:0; }

:root{
  --cream:#FBF3E3;
  --paper:#FCF8ED;
  --red:#C1272D;
  --red-dark:#8C1C21;
  --gingham:#D9524B;
  --pink:#F3A9B4;
  --charcoal:#15120E;
  --ink:#3A2A20;
}

html,body{
  height:100%;
  background:var(--charcoal);
  color:var(--ink);
  font-family:'Baloo 2', sans-serif;
  overflow:hidden;
}

body{
  background-image:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,0.03), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(255,255,255,0.03), transparent 40%);
}

/* ---------- AURORA BACKGROUND ---------- */
.aurora{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  background:var(--charcoal);
}
.aurora span{
  position:absolute;
  border-radius:50%;
  filter:blur(70px);
  opacity:0.35;
  mix-blend-mode:screen;
}
.aurora span:nth-child(1){
  width:60vw; height:60vw;
  top:-20%; left:-10%;
  background:radial-gradient(circle, var(--red) 0%, transparent 70%);
  animation:aurora-drift-1 22s ease-in-out infinite;
}
.aurora span:nth-child(2){
  width:55vw; height:55vw;
  top:10%; right:-15%;
  background:radial-gradient(circle, var(--pink) 0%, transparent 70%);
  animation:aurora-drift-2 26s ease-in-out infinite;
}
.aurora span:nth-child(3){
  width:50vw; height:50vw;
  bottom:-20%; left:20%;
  background:radial-gradient(circle, #7A1F2B 0%, transparent 70%);
  animation:aurora-drift-3 30s ease-in-out infinite;
}
@keyframes aurora-drift-1{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(8vw,6vh) scale(1.15); }
}
@keyframes aurora-drift-2{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(-6vw,8vh) scale(1.1); }
}
@keyframes aurora-drift-3{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(5vw,-6vh) scale(1.2); }
}
.stage{ position:relative; z-index:1; }
@media (prefers-reduced-motion: reduce){
  .aurora span{ animation:none !important; }
}

canvas#confetti{
  position:fixed; inset:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:999;
}

/* ---------- STAGE / SCREENS ---------- */
.stage{
  position:relative;
  width:100%;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  opacity:0;
  transform:translateX(40px) scale(0.98);
  pointer-events:none;
  transition:opacity 0.5s ease, transform 0.5s ease;
  overflow-y:auto;
}
.screen.active{ pointer-events:auto; }
.screen::-webkit-scrollbar{ width:0; height:0; }
.screen.active{
  opacity:1;
  transform:translateX(0) scale(1);
  pointer-events:auto;
}
.screen.leaving{
  transform:translateX(-40px) scale(0.98);
}

/* ---------- GINGHAM CARD ---------- */
.card{
  position:relative;
  width:100%;
  max-width:480px;
  background:
    repeating-linear-gradient(45deg, var(--gingham) 0 10px, transparent 10px 20px),
    repeating-linear-gradient(-45deg, var(--gingham) 0 10px, transparent 10px 20px),
    var(--paper);
  background-size:100% 100%;
  padding:10px;
  border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  transition:max-width 0.3s ease;
}
.card-inner{
  background:var(--paper);
  border-radius:16px;
  padding:34px 26px 28px;
  min-height:420px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:16px;
  position:relative;
  background-image:
    radial-gradient(circle, rgba(0,0,0,0.025) 1px, transparent 1px);
  background-size:6px 6px;
  overflow:visible;
}

/* ---------- LANDSCAPE / LAPTOP LAYOUT ---------- */
@media (min-width:860px) and (min-aspect-ratio:1/1){
  .stage{ padding:30px 60px; }
  .card{ max-width:1000px; }
  .card-inner{ min-height:480px; padding:50px 70px; }
  .card-inner.split{
    flex-direction:row;
    align-items:center;
    text-align:left;
    gap:48px;
  }
  .card-inner.split.reverse{ flex-direction:row-reverse; }
  .card-inner.split .text-col{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:16px;
    flex:1;
  }
  .card-inner.split .btn-row{ justify-content:flex-start; }
  .card-inner.split .photo-frame.sticker{
    width:220px; height:220px;
    flex-shrink:0;
  }
  .headline{ text-align:inherit; }
}

/* ---------- GOOFY PHOTO STICKERS ---------- */
.photo-frame.sticker{
  width:190px;
  height:190px;
  border:8px solid white;
  box-shadow:0 12px 26px rgba(0,0,0,0.32);
  transform:rotate(-7deg);
  font-size:12px;
}
.corner-sticker{
  position:absolute;
  width:100px;
  height:100px;
  border:6px solid white;
  border-radius:10px;
  box-shadow:0 10px 22px rgba(0,0,0,0.3);
  background:repeating-linear-gradient(45deg,#f0e2c8,#f0e2c8 6px,#e6d4ae 6px,#e6d4ae 12px);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  color:#a0895f;
  text-align:center;
  z-index:6;
  overflow:hidden;
}
.corner-sticker img{ width:100%; height:100%; object-fit:cover; display:block; }
.corner-sticker .ph-fallback{ padding:4px; }
.corner-sticker.left{ bottom:-18px; left:-14px; transform:rotate(-8deg); }
.corner-sticker.right{ bottom:-18px; right:-14px; transform:rotate(8deg); }
@media (max-width:520px){
  .corner-sticker{ width:64px; height:64px; font-size:8px; }
  .corner-sticker.left{ bottom:-12px; left:-8px; }
  .corner-sticker.right{ bottom:-12px; right:-8px; }
}

.progress{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  color:var(--pink);
  font-family:'Caveat', cursive;
  font-size:22px;
  letter-spacing:1px;
  z-index:10;
  text-shadow:0 1px 3px rgba(0,0,0,0.5);
}

.headline{
  font-family:'Baloo 2', sans-serif;
  font-weight:700;
  font-size:clamp(24px, 6vw, 32px);
  color:var(--red-dark);
  line-height:1.15;
}
.headline.script{
  font-family:'Caveat', cursive;
  font-weight:600;
  font-size:clamp(30px, 8vw, 42px);
}
.sub{
  font-size:16px;
  color:var(--ink);
  opacity:0.8;
}

.photo-frame{
  width:170px;
  height:170px;
  border-radius:14px;
  border:6px solid white;
  box-shadow:0 6px 18px rgba(0,0,0,0.2);
  background:repeating-linear-gradient(45deg,#f0e2c8,#f0e2c8 8px,#e6d4ae 8px,#e6d4ae 16px);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  color:#a0895f;
  text-align:center;
  transform:rotate(-2deg);
  overflow:hidden;
  flex-shrink:0;
}
.photo-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
.photo-frame .ph-fallback{ padding:6px; }
.photo-frame.round{ border-radius:50%; }

.btn-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:auto; }

.pill-btn{
  font-family:'Baloo 2', sans-serif;
  font-weight:700;
  font-size:16px;
  color:white;
  background:var(--red);
  border:none;
  border-radius:100px;
  padding:12px 28px;
  cursor:pointer;
  box-shadow:0 4px 0 var(--red-dark);
  transition:transform 0.12s ease, box-shadow 0.12s ease;
}
.pill-btn:hover{ transform:translateY(-2px); }
.pill-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--red-dark); }
.pill-btn.ghost{
  background:transparent;
  color:var(--red-dark);
  border:2px solid var(--red-dark);
  box-shadow:none;
  padding:10px 26px;
}

.hint{
  font-family:'Caveat', cursive;
  font-size:18px;
  color:var(--red);
  min-height:22px;
}

/* ---------- GIFTS ---------- */
.gifts-row{ display:flex; gap:16px; justify-content:center; }
.gift{
  width:80px; height:80px;
  cursor:pointer;
  position:relative;
  transition:transform 0.2s ease;
}
.gift:hover{ transform:translateY(-4px) scale(1.05); }
.gift svg{ width:100%; height:100%; }
.gift.opened{ pointer-events:none; opacity:0.35; transform:scale(0.9); }
.gift-reveal{
  margin-top:8px;
  font-size:14px;
  background:#FFF1E6;
  border:2px dashed var(--pink);
  border-radius:10px;
  padding:10px 12px;
  max-width:380px;
  display:none;
}
.gift-reveal.show{ display:block; animation:pop 0.3s ease; }
@keyframes pop{ from{ transform:scale(0.9); opacity:0;} to{ transform:scale(1); opacity:1; } }

/* ---------- MESSAGE / LETTER ---------- */
.message-text{
  font-size:16px;
  line-height:1.6;
  color:var(--ink);
  max-width:380px;
  white-space:pre-line;
}
.letter{
  font-family:'Caveat', cursive;
  font-size:20px;
  line-height:1.55;
  color:var(--ink);
  text-align:left;
  max-width:380px;
  white-space:pre-line;
}
.ribbon{
  background:var(--red);
  color:white;
  font-family:'Caveat', cursive;
  font-size:24px;
  padding:6px 22px;
  border-radius:4px;
  transform:rotate(-2deg);
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* ---------- CAKE ---------- */
.cake-wrap{ font-size:64px; position:relative; line-height:1; }
.flame{ display:inline-block; animation:flicker 1.1s ease-in-out infinite; }
.flame.out{ opacity:0; transition:opacity 0.4s ease; }
@keyframes flicker{
  0%,100%{ transform:scale(1) rotate(-3deg); }
  50%{ transform:scale(1.12) rotate(3deg); }
}
.smoke{
  position:absolute;
  top:-6px; left:50%;
  width:6px; height:6px;
  background:rgba(255,255,255,0.5);
  border-radius:50%;
  opacity:0;
}

/* ---------- MEMORIES ---------- */
.clothesline{
  width:100%;
  border-top:2px dashed var(--red-dark);
  margin-top:6px;
  position:relative;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:18px;
  padding-top:18px;
}
.polaroid{
  background:white;
  padding:8px 8px 20px;
  width:clamp(110px, 20vw, 170px);
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  cursor:pointer;
  transition:transform 0.2s ease;
  font-size:9px;
  text-align:center;
  color:#888;
}
.polaroid:nth-child(odd){ transform:rotate(-6deg); }
.polaroid:nth-child(even){ transform:rotate(5deg); }
.polaroid:hover{ transform:scale(1.08) rotate(0deg); z-index:5; }
.polaroid .ph{
  width:100%; aspect-ratio:1/1;
  background:repeating-linear-gradient(45deg,#f0e2c8,#f0e2c8 6px,#e6d4ae 6px,#e6d4ae 12px);
  margin-bottom:6px;
}
.polaroid img{ width:100%; height:100%; object-fit:cover; }
.caption{ font-family:'Caveat', cursive; font-size:15px; color:var(--red-dark); margin-top:4px; }

.lightbox{
  position:fixed; inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:20px;
}
.lightbox.show{ display:flex; }
.lightbox-inner{
  background:white;
  padding:14px 14px 20px;
  max-width:320px;
  border-radius:6px;
  text-align:center;
}
.lightbox-inner .ph{
  width:100%; aspect-ratio:1/1;
  background:repeating-linear-gradient(45deg,#f0e2c8,#f0e2c8 8px,#e6d4ae 8px,#e6d4ae 16px);
  margin-bottom:10px;
}
.lightbox-inner .caption{ font-size:18px; }
.lightbox-close{
  margin-top:12px;
  background:var(--red);
  color:white;
  border:none;
  border-radius:100px;
  padding:8px 20px;
  font-family:'Baloo 2', sans-serif;
  cursor:pointer;
}

/* ---------- REEL (Instagram-style video moment) ---------- */
.reel-wrap{
  position:relative;
  width:220px;
  aspect-ratio:9/16;
  max-height:52vh;
  background:#111;
  border-radius:18px;
  overflow:hidden;
  margin:0 auto;
  box-shadow:0 14px 30px rgba(0,0,0,0.4);
}
.reel-video{
  width:100%; height:100%;
  object-fit:cover;
  display:block;
}
.reel-video-fallback{
  position:absolute; inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  text-align:center;
  color:#ddd;
  font-size:11px;
  line-height:1.5;
  background:repeating-linear-gradient(45deg,#1a1a1a,#1a1a1a 8px,#0d0d0d 8px,#0d0d0d 16px);
  z-index:2;
}
.reel-top{
  position:absolute;
  top:10px; left:10px;
  display:flex;
  align-items:center;
  gap:6px;
  z-index:3;
}
.reel-avatar{
  width:26px; height:26px;
  border-radius:50%;
  background:var(--red);
  display:flex; align-items:center; justify-content:center;
  font-size:13px;
  border:2px solid white;
}
.reel-username{
  color:white;
  font-size:11px;
  font-weight:600;
  text-shadow:0 1px 3px rgba(0,0,0,0.6);
}
.reel-caption{
  position:absolute;
  bottom:14px; left:10px;
  max-width:150px;
  color:white;
  font-size:11px;
  line-height:1.4;
  text-shadow:0 1px 3px rgba(0,0,0,0.6);
  z-index:3;
}
.reel-actions{
  position:absolute;
  bottom:14px; right:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  z-index:3;
}
.reel-action{
  background:none;
  border:none;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  font-size:20px;
  cursor:pointer;
  text-shadow:0 1px 3px rgba(0,0,0,0.6);
}
.reel-count{
  font-size:10px;
  font-family:'Baloo 2', sans-serif;
}
.reel-heart-burst{
  position:absolute;
  top:50%; left:50%;
  font-size:60px;
  transform:translate(-50%,-50%) scale(0);
  opacity:0;
  pointer-events:none;
  z-index:4;
}
.reel-heart-burst.pop{
  animation:reel-heart-pop 0.7s ease forwards;
}
@keyframes reel-heart-pop{
  0%{ transform:translate(-50%,-50%) scale(0); opacity:0.9; }
  40%{ transform:translate(-50%,-50%) scale(1.15); opacity:1; }
  100%{ transform:translate(-50%,-50%) scale(1.3); opacity:0; }
}
.reel-comments{
  position:absolute;
  left:0; right:0; bottom:0;
  max-height:62%;
  background:rgba(20,20,20,0.94);
  border-radius:16px 16px 0 0;
  transform:translateY(100%);
  transition:transform 0.3s ease;
  z-index:5;
  display:flex;
  flex-direction:column;
}
.reel-comments.show{ transform:translateY(0); }
.reel-comments-header{
  color:white;
  font-family:'Baloo 2', sans-serif;
  font-size:13px;
  padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,0.15);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.reel-comments-close{
  background:none; border:none; color:white; font-size:14px; cursor:pointer;
}
.reel-comments-list{
  overflow-y:auto;
  padding:10px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.reel-comment{
  color:#eee;
  font-size:11.5px;
  line-height:1.4;
}
.reel-comment strong{ color:white; }

/* ---------- MUSIC TOGGLE ---------- */
.music-btn{
  position:fixed;
  top:16px;
  right:16px;
  width:40px; height:40px;
  border-radius:50%;
  background:var(--red);
  color:white;
  border:none;
  font-size:16px;
  cursor:pointer;
  z-index:10;
  box-shadow:0 3px 8px rgba(0,0,0,0.4);
}

/* ---------- REPLAY ---------- */
.replay-hearts{ font-size:22px; }

@media (prefers-reduced-motion: reduce){
  .flame, .gift:hover{ animation:none !important; transform:none !important; }
}

@media (max-width:380px){
  .card-inner{ padding:26px 18px 22px; min-height:380px; }
  .gifts-row{ gap:10px; }
  .gift{ width:66px; height:66px; }
}
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>
<canvas id="confetti"></canvas>
<div class="progress" id="progress">♡ 1 / 10</div>
<button class="music-btn" id="musicBtn" title="Toggle music">♫</button>
<audio id="bgMusic" loop>
  <!-- EDIT: MUSIC — replace with a real mp3 path if you have one -->
  <source src="birthday-song.mp3" type="audio/mpeg">
</audio>

<div class="stage" id="stage"></div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <div class="ph" id="lightboxPh"></div>
    <div class="caption" id="lightboxCaption"></div>
    <button class="lightbox-close" onclick="closeLightbox()">Close</button>
  </div>
</div>

<script>
/* ================================================================
   EDIT ME — all personal content lives in this one config object.
   Replace text, and swap photo placeholders for real <img> paths
   by editing the renderScreens() photo-frame lines below where noted.
   ================================================================ */
const CONFIG = {
  name: "Alex",
  age: "25",
  mainMessage: "Happy Birthday, Alex!\n\nToday is all about celebrating you — every laugh, every ridiculous story, every little thing that makes you, you. I hope this year brings you everything you've been quietly hoping for.",
  letter: "Dear Alex,\n\nHappy Birthday! I honestly don't know where to begin because there are so many things I could say about you.\n\nThank you for all the laughs, the random conversations, the silly jokes, and all the little moments that somehow became some of my favourite memories.\n\nYou mean so much to me and I'm really grateful to have you in my life.\n\nHappy Birthday once again.",
  giftMessages: [
    "A little reminder that you're appreciated more than you know.",
    "Remember that one trip we took? Best memory ever.",
    "Here's to another year of chaos and good times together."
  ],
  memories: [
    { file: "memory-1.jpg", caption: "That day ❤️" },
    { file: "memory-2.jpg", caption: "Best cake ever 🎂" },
    { file: "memory-3.jpg", caption: "Us being goofy 😄" },
    { file: "memory-4.jpg", caption: "Never forget this" }
  ],
  reel: {
    caption: "when the birthday hits different 🎉🎂 #birthdayweek",
    baseLikes: 128,
    comments: [
      { user: "bestie_01", text: "STOP this is too funny 😭" },
      { user: "mom", text: "my favourite person in the world ❤️" },
      { user: "random_friend", text: "we don't deserve you honestly" },
      { user: "old_roommate", text: "iconic behaviour as always 👑" },
      { user: "cousin_k", text: "happy birthday legend 🎈" }
    ]
  }
};

/* ---------- CONFETTI ---------- */
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);
const colors = ['#C1272D','#F3A9B4','#FBF3E3','#8C1C21'];
let particles = [];
function burstConfetti(x, y, count=110){
  for(let i=0;i<count;i++){
    particles.push({
      x, y,
      vx:(Math.random()-0.5)*12,
      vy:(Math.random()-1.6)*12,
      size:Math.random()*7+4,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,
      rotSpeed:(Math.random()-0.5)*10,
      life:0
    });
  }
}
function burstHearts(x,y,count=14){
  for(let i=0;i<count;i++){
    particles.push({
      x, y,
      vx:(Math.random()-0.5)*4,
      vy:-Math.random()*3-2,
      size:14,
      heart:true,
      rot:0, rotSpeed:0,
      life:0
    });
  }
}
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.vy += p.heart ? 0.02 : 0.32;
    p.x += p.vx; p.y += p.vy; p.rot += p.rotSpeed; p.life++;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot*Math.PI/180);
    if(p.heart){
      ctx.font = p.size+"px serif";
      ctx.fillText("♥", -p.size/2, 0);
      ctx.globalAlpha = Math.max(0, 1 - p.life/120);
      ctx.fillStyle = "#C1272D";
      ctx.fillText("♥", -p.size/2, 0);
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    }
    ctx.restore();
  });
  particles = particles.filter(p => p.life < 300 && p.y < canvas.height+60);
  requestAnimationFrame(loop);
}
loop();

/* ---------- MUSIC ---------- */
const music = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
let musicOn = false;

function setMusicUI(playing){
  musicOn = playing;
  musicBtn.textContent = playing ? '❚❚' : '♫';
}

function tryAutoplay(){
  const p = music.play();
  if(p !== undefined){
    p.then(()=> setMusicUI(true))
     .catch(()=>{
        // Autoplay blocked by the browser — start on the first tap/click instead.
        const startOnInteract = ()=>{
          music.play().then(()=> setMusicUI(true)).catch(()=>{});
          document.removeEventListener('click', startOnInteract);
          document.removeEventListener('touchstart', startOnInteract);
        };
        document.addEventListener('click', startOnInteract, { once:true });
        document.addEventListener('touchstart', startOnInteract, { once:true });
     });
  }
}
window.addEventListener('DOMContentLoaded', tryAutoplay);

musicBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  if(musicOn){ music.pause(); setMusicUI(false); }
  else { music.play().then(()=> setMusicUI(true)).catch(()=>{}); }
});

  const screens = document.querySelectorAll('.screen');
  screens[current].classList.remove('active');

  current = index;

  requestAnimationFrame(()=> screens[current].classList.add('active'));
  progressEl.textContent = `♡ ${current+1} / 10`;
}

function photoBox(filename, label, round=false, sticker=true){
  return `<div class="photo-frame${round?' round':''}${sticker?' sticker':''}">
    <img src="images/${filename}" alt="${label}"
      onerror="this.remove(); this.parentElement.querySelector('.ph-fallback').style.display='block';">
    <span class="ph-fallback" style="display:none;">${label}<br><small>images/${filename}</small></span>
  </div>`;
}

function cornerSticker(pos, filename, label){
  return `<div class="corner-sticker ${pos}">
    <img src="images/${filename}" alt="${label}"
      onerror="this.remove(); this.parentElement.querySelector('.ph-fallback').style.display='block';">
    <span class="ph-fallback" style="display:none;">${label}<br><small>images/${filename}</small></span>
  </div>`;
}

/* ---------- INTERACTIONS ---------- */
function attachInteractions(){
  const noBtn = document.getElementById('noBtn');
  const noHint = document.getElementById('noHint');
  const noResponses = ["Hmm... try again 😏","Nope, wrong button 👀","Nice try 😄","Okay fine, click YES 😌"];
  noBtn.addEventListener('click', ()=>{
    noTries++;
    noHint.textContent = noResponses[Math.min(noTries-1, noResponses.length-1)];
    const angle = (Math.random()-0.5)*160;
    const dist = 40 + Math.random()*60;
    noBtn.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
  });

  document.getElementById('tryAgainBtn').addEventListener('click', function(){
    this.closest('.card').style.animation = 'none';
    void this.offsetWidth;
    this.closest('.card').animate(
      [{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],
      {duration:300}
    );
    setTimeout(()=> goTo(2), 320);
  });

  document.getElementById('yes1Btn').addEventListener('click', ()=> yesToScreen4());
  document.getElementById('yes2Btn').addEventListener('click', ()=> yesToScreen4());
  function yesToScreen4(){
    const r = document.querySelector('#stage .screen.active').getBoundingClientRect();
    burstHearts(r.left + r.width/2, r.top + r.height/2);
    setTimeout(()=> goTo(3), 250);
  }

  document.getElementById('blowBtn').addEventListener('click', function(){
    const flame = document.getElementById('flame');
    flame.classList.add('out');
    const r = this.getBoundingClientRect();
    burstConfetti(r.left, r.top, 90);
    burstHearts(r.left, r.top - 30);
    document.getElementById('wishHint').textContent = 'Wish made! ✨';
    this.style.display = 'none';
    document.getElementById('afterWish').style.display = 'flex';
  });

  document.getElementById('replayBtn').addEventListener('click', ()=>{
    goTo(0);
    noTries = 0;
    giftsOpened = [false,false,false];
    setTimeout(renderAndReattach, 500);
  });

  /* ---- Reel screen (Instagram-style, cosmetic only) ---- */
  const reelVideo = document.getElementById('reelVideo');
  const reelFallback = document.getElementById('reelFallback');
  reelVideo.addEventListener('error', ()=>{
    reelVideo.style.display = 'none';
    reelFallback.style.display = 'flex';
  });
  reelVideo.play().catch(()=>{});

  let reelLiked = false;
  let reelLikes = CONFIG.reel.baseLikes;
  const reelLikeBtn = document.getElementById('reelLikeBtn');
  const reelHeartIcon = document.getElementById('reelHeartIcon');
  const reelLikeCount = document.getElementById('reelLikeCount');
  const reelHeartBurst = document.getElementById('reelHeartBurst');

  reelLikeBtn.addEventListener('click', ()=>{
    reelLiked = !reelLiked;
    reelLikes += reelLiked ? 1 : -1;
    reelHeartIcon.textContent = reelLiked ? '❤️' : '🤍';
    reelLikeCount.textContent = reelLikes;
    if(reelLiked){
      reelHeartBurst.classList.remove('pop');
      void reelHeartBurst.offsetWidth;
      reelHeartBurst.classList.add('pop');
    }
  });

  const reelComments = document.getElementById('reelComments');
  document.getElementById('reelCommentBtn').addEventListener('click', ()=>{
    reelComments.classList.add('show');
  });
  document.getElementById('reelCommentsClose').addEventListener('click', ()=>{
    reelComments.classList.remove('show');
  });

  document.getElementById('reelShareBtn').addEventListener('click', function(){
    const original = this.innerHTML;
    this.innerHTML = '<span>✅</span><span class="reel-count">Shared!</span>';
    setTimeout(()=>{ this.innerHTML = original; }, 1400);
  });
}

function renderAndReattach(){
  renderScreens();
  attachInteractions();
  document.querySelectorAll('.screen')[0].classList.add('active');
}

function openGift(i){
  if(giftsOpened[i]) return;
  giftsOpened[i] = true;
  const giftEl = document.querySelector(`.gift[data-i="${i}"]`);
  giftEl.classList.add('opened');
  const reveal = document.getElementById('giftReveal'+i);
  reveal.textContent = CONFIG.giftMessages[i];
  reveal.classList.add('show');
  const r = giftEl.getBoundingClientRect();
  burstConfetti(r.left, r.top, 40);
  if(giftsOpened.every(Boolean)){
    document.getElementById('continueGiftsBtn').style.display = 'inline-block';
    document.getElementById('continueGiftsBtn').onclick = ()=> goTo(4);
  }
}

function openLightbox(i){
  const m = CONFIG.memories[i];
  document.getElementById('lightboxCaption').textContent = m.caption;
  document.getElementById('lightboxPh').innerHTML =
    `<img src="images/${m.file}" alt="${m.caption}" style="width:100%;height:100%;object-fit:cover;" onerror="this.remove();">`;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}
